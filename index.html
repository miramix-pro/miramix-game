<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d2244">
<title>MiraMix — Поймай каплю!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --navy-card: #14294d;
    --navy-deep: #081a33;
    --orange: #f26b1d;
    --orange-hover: #ff7f33;
    --yellow: #f5c518;
    --muted: #8ba0c0;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 20%, #16325c 0%, var(--navy-deep) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e8edf5; padding: 8px;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    width: 100%; max-width: 480px;
    background: var(--navy-card); border-radius: 20px; padding: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .app::before, .app::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(40px); opacity: 0.25; pointer-events: none;
  }
  .app::before { width: 160px; height: 160px; background: var(--orange); top: -70px; right: -70px; }
  .app::after { width: 140px; height: 140px; background: #3b82f6; bottom: -70px; left: -70px; }

  header { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; }
  .brand .mascot-head { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
  .brand .name { color: #fff; }
  .brand .divider { color: rgba(255,255,255,0.2); font-weight: 300; }
  .brand .game-name { font-size: 13px; font-weight: 500; color: var(--muted); }
  .tagline { font-size: 10px; color: var(--orange); margin-top: 3px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); margin-bottom: 8px;
    padding: 0 4px; position: relative; z-index: 1;
  }
  .hud b { color: #fff; font-size: 15px; }
  .hud .lives { display: flex; gap: 4px; }
  .hud .life { width: 14px; height: 14px; border-radius: 50%; background: var(--orange); transition: opacity 0.3s; }
  .hud .life.lost { opacity: 0.2; }

  .game-wrap {
    position: relative; width: 100%; aspect-ratio: 3/4; max-height: 58vh;
    background: linear-gradient(180deg, #0d2244 0%, #081a33 100%);
    border-radius: 14px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    margin-bottom: 10px;
    position: relative; z-index: 1;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8, 26, 51, 0.85);
    text-align: center; padding: 20px;
    z-index: 3;
  }
  .overlay.hidden { display: none; }
  .overlay .mascot-big {
    width: 110px; height: 110px; object-fit: contain;
    margin-bottom: 10px;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .overlay h2 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; }
  .overlay p { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 16px; max-width: 300px; }
  .overlay .btn {
    padding: 14px 28px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.4px; border: none; border-radius: 12px; cursor: pointer;
    font-family: inherit; color: #fff; background: var(--orange);
    box-shadow: 0 8px 24px rgba(242,107,29,0.4);
    text-transform: uppercase;
  }
  .overlay .btn:active { transform: scale(0.97); background: var(--orange-hover); }
  .overlay .btn.secondary {
    background: rgba(255,255,255,0.1); color: #cfe0ff;
    box-shadow: none; margin-top: 8px;
    text-transform: none; font-weight: 600;
    padding: 12px 24px; font-size: 14px;
  }
  .overlay .final-score {
    font-size: 48px; font-weight: 800; color: var(--orange);
    margin: 4px 0; font-variant-numeric: tabular-nums;
  }
  .overlay .final-rank { font-size: 14px; color: #dbe6f7; margin-bottom: 16px; line-height: 1.35; }

  .controls-hint {
    text-align: center; font-size: 11px; color: var(--muted);
    position: relative; z-index: 1;
  }
  .controls-hint b { color: #cfe0ff; }

  .mobile-controls {
    display: none; gap: 10px; margin-top: 10px;
    position: relative; z-index: 1;
  }
  .mobile-controls button {
    flex: 1; padding: 18px; font-size: 24px; font-weight: 700;
    border-radius: 12px; cursor: pointer;
    font-family: inherit; color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .mobile-controls button:active {
    background: var(--orange);
    border-color: var(--orange);
  }
  @media (hover: none) and (pointer: coarse) {
    .mobile-controls { display: flex; }
    .controls-hint { display: none; }
  }

  footer { text-align: center; margin-top: 10px; font-size: 11px; color: var(--muted); position: relative; z-index: 1; }
  .footer-brand {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; color: #cfe0ff; font-weight: 600; margin-bottom: 6px;
  }
  .footer-brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
  .footer-phone {
    display: inline-flex; align-items: center; gap: 6px;
    color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums; padding: 6px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img src="miramix-mascot.png" alt="MiraMix" class="mascot-head" onerror="this.style.display='none'">
        <span class="name">MiraMix</span>
        <span class="divider">|</span>
        <span class="game-name">Поймай каплю!</span>
      </div>
      <div class="tagline">car paint system</div>
    </header>

    <div class="hud">
      <div>Счёт: <b id="score">0</b></div>
      <div>Рекорд: <b id="best">0</b></div>
      <div class="lives">
        <div class="life" data-i="0"></div>
        <div class="life" data-i="1"></div>
        <div class="life" data-i="2"></div>
      </div>
    </div>

    <div class="game-wrap" id="gameWrap">
      <canvas id="game"></canvas>

      <div class="overlay" id="startOverlay">
        <img src="miramix-mascot.png" alt="MiraMix" class="mascot-big" onerror="this.style.display='none'">
        <h2>Поймай каплю! 🎨</h2>
        <p>Двигай банку MiraMix и лови падающие капли краски.<br>Пропустишь 3 капли — игра окончена!</p>
        <button class="btn" id="startBtn" type="button">Играть</button>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div style="font-size:52px; margin-bottom:6px;">💧</div>
        <h2>Игра окончена</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="final-rank" id="finalRank"></div>
        <button class="btn" id="restartBtn" type="button">Сыграть ещё</button>
      </div>
    </div>

    <div class="controls-hint">
      Управление: <b>← →</b> или <b>A / D</b>, свайп на телефоне
    </div>

    <div class="mobile-controls">
      <button id="btnLeft" type="button">←</button>
      <button id="btnRight" type="button">→</button>
    </div>

    <footer>
      <div class="footer-brand">
        <span class="dot"></span>
        <span>MiraMix · car paint system</span>
      </div>
      <a href="tel:+79281213774" class="footer-phone">📞 8 928 121-37-74</a>
    </footer>
  </div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('gameWrap');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var livesEls = document.querySelectorAll('.life');
  var startOverlay = document.getElementById('startOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var finalRankEl = document.getElementById('finalRank');

  var COLORS = [
    { top: '#ff5a4a', bot: '#b91c1c' },
    { top: '#60a5fa', bot: '#1e40af' },
    { top: '#fde047', bot: '#ca8a04' },
    { top: '#4ade80', bot: '#15803d' },
    { top: '#fb923c', bot: '#c2410c' },
    { top: '#c084fc', bot: '#7e22ce' },
    { top: '#67e8f9', bot: '#0e7490' }
  ];

  var W = 0, H = 0, DPR = 1;
  var state = 'idle';
  var score = 0;
  var best = 0;
  // localStorage может быть заблокирован в песочнице — используем try/catch
  try { best = parseInt(localStorage.getItem('miramix_catch_best') || '0', 10) || 0; } catch(e) { best = 0; }
  var lives = 3;
  var drops = [];
  var particles = [];
  var lastTime = 0;
  var spawnTimer = 0;
  var spawnInterval = 900;
  var dropSpeed = 180;
  var elapsed = 0;

  var player = { x: 0, y: 0, w: 70, h: 80, speed: 420, img: null, imgReady: false };

  var mascot = new Image();
  mascot.onload = function(){ player.img = mascot; player.imgReady = true; };
  mascot.onerror = function(){ player.imgReady = false; };
  mascot.src = 'miramix-mascot.png';

  function resize() {
    var rect = wrap.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.w = Math.min(80, W * 0.22);
    player.h = player.w * 1.15;
    player.y = H - player.h - 8;
    if (player.x === 0) player.x = W / 2 - player.w / 2;
    if (player.x > W - player.w) player.x = W - player.w;
  }

  var keys = { left: false, right: false };

  document.addEventListener('keydown', function(e){
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; e.preventDefault(); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'idle' || state === 'gameover') start();
    }
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  var touchStartX = null;
  wrap.addEventListener('touchstart', function(e){
    if (e.touches.length) touchStartX = e.touches[0].clientX;
  }, { passive: true });
  wrap.addEventListener('touchmove', function(e){
    if (touchStartX === null || !e.touches.length) return;
    var x = e.touches[0].clientX;
    var dx = x - touchStartX;
    player.x = Math.max(0, Math.min(W - player.w, player.x + dx));
    touchStartX = x;
  }, { passive: true });
  wrap.addEventListener('touchend', function(){ touchStartX = null; });

  function bindHold(el, key) {
    if (!el) return;
    var start = function(e){ e.preventDefault(); keys[key] = true; };
    var stop = function(){ keys[key] = false; };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', stop);
    el.addEventListener('touchcancel', stop);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', stop);
    el.addEventListener('mouseleave', stop);
  }
  bindHold(document.getElementById('btnLeft'), 'left');
  bindHold(document.getElementById('btnRight'), 'right');

  function spawnDrop() {
    var color = COLORS[Math.floor(Math.random() * COLORS.length)];
    var r = 14 + Math.random() * 8;
    var baseX = r + Math.random() * (W - r * 2);
    drops.push({
      x: baseX, baseX: baseX, y: -r - 10, r: r,
      vy: dropSpeed + Math.random() * 60,
      color: color,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 1.5 + Math.random() * 1.5,
      wobbleAmp: 6 + Math.random() * 8
    });
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 12; i++) {
      var a = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
      var sp = 80 + Math.random() * 160;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5, maxLife: 0.5,
        r: 2 + Math.random() * 3,
        color: color.top
      });
    }
  }

  function updateLives() {
    for (var i = 0; i < livesEls.length; i++) {
      if (i >= lives) livesEls[i].classList.add('lost');
      else livesEls[i].classList.remove('lost');
    }
  }

  function start() {
    state = 'playing';
    score = 0;
    lives = 3;
    drops = [];
    particles = [];
    spawnTimer = 0;
    spawnInterval = 900;
    dropSpeed = 180;
    elapsed = 0;
    player.x = W / 2 - player.w / 2;
    scoreEl.textContent = '0';
    updateLives();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
  }

  function gameOver() {
    state = 'gameover';
    if (score > best) {
      best = score;
      try { localStorage.setItem('miramix_catch_best', String(best)); } catch(e) {}
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = score;
    finalRankEl.textContent = rankFromScore(score);
    gameOverOverlay.classList.remove('hidden');
  }

  function rankFromScore(s) {
    if (s >= 60) return '🏆 Мастер-колорист · реакция снайпера';
    if (s >= 40) return '🥇 Опытный колорист · отличный результат';
    if (s >= 25) return '🥈 Уверенный уровень · хорошая реакция';
    if (s >= 12) return '🥉 Начинающий · есть куда расти';
    return '😅 Нужна практика · попробуй ещё раз';
  }

  function update(dt) {
    if (state !== 'playing') return;
    elapsed += dt;
    spawnInterval = Math.max(320, 900 - elapsed * 18);
    dropSpeed = 180 + elapsed * 14;

    if (keys.left) player.x -= player.speed * dt;
    if (keys.right) player.x += player.speed * dt;
    if (player.x < 0) player.x = 0;
    if (player.x > W - player.w) player.x = W - player.w;

    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnDrop();
    }

    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.y += d.vy * dt;
      d.wobble += d.wobbleSpeed * dt;
      d.x = d.baseX + Math.sin(d.wobble) * d.wobbleAmp;

      var pTop = player.y + player.h * 0.15;
      if (d.y + d.r > pTop && d.y - d.r < player.y + player.h &&
          d.x > player.x - d.r * 0.4 && d.x < player.x + player.w + d.r * 0.4) {
        score++;
        scoreEl.textContent = score;
        spawnParticles(d.x, d.y, d.color);
        drops.splice(i, 1);
        continue;
      }

      if (d.y - d.r > H) {
        drops.splice(i, 1);
        lives--;
        updateLives();
        if (lives <= 0) { gameOver(); return; }
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 320 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }
  }

  function drawDrop(d) {
    var g = ctx.createLinearGradient(d.x, d.y - d.r, d.x, d.y + d.r);
    g.addColorStop(0, d.color.top);
    g.addColorStop(1, d.color.bot);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y - d.r * 1.4);
    ctx.bezierCurveTo(d.x + d.r * 0.6, d.y - d.r * 0.6, d.x + d.r, d.y + d.r * 0.2, d.x, d.y + d.r);
    ctx.bezierCurveTo(d.x - d.r, d.y + d.r * 0.2, d.x - d.r * 0.6, d.y - d.r * 0.6, d.x, d.y - d.r * 1.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(d.x - d.r * 0.35, d.y + d.r * 0.1, d.r * 0.22, d.r * 0.35, -0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    var x = player.x, y = player.y, w = player.w, h = player.h;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h - 2, w * 0.4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (player.imgReady && player.img) {
      ctx.drawImage(player.img, x, y, w, h);
    } else {
      var g = ctx.createLinearGradient(x, y, x + w, y);
      g.addColorStop(0, '#1e3a8a');
      g.addColorStop(0.5, '#3b82f6');
      g.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = g;
      ctx.fillRect(x, y + 6, w, h - 6);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(x - 3, y, w + 6, 8);
      ctx.fillRect(x - 3, y + h - 6, w + 6, 8);
      ctx.fillStyle = '#f5c518';
      ctx.fillRect(x + 6, y + h * 0.5, w - 12, h * 0.25);
      ctx.fillStyle = '#0d2244';
      ctx.font = 'bold ' + Math.floor(w * 0.14) + 'px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('MiraMix', x + w / 2, y + h * 0.65);
    }
  }

  function drawBackground() {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    var i, j;
    for (i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
    for (j = 0; j < H; j += 40) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(W, j); ctx.stroke(); }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    for (var i = 0; i < drops.length; i++) drawDrop(drops[i]);
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawPlayer();
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    var dt = Math.min((t - lastTime) / 1000, 0.05) || 0;
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  bestEl.textContent = best;

  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  if (startBtn) startBtn.addEventListener('click', function(e){ e.preventDefault(); start(); });
  if (restartBtn) restartBtn.addEventListener('click', function(e){ e.preventDefault(); start(); });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
